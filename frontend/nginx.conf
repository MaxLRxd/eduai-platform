server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos subidos por docentes pueden pesar hasta MAX_FILE_SIZE_MB (50 MB por defecto).
    client_max_body_size 55m;

    # Resolver en cada request (no al arrancar): nginx no cae si el backend todavia no esta arriba.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre: se pueden cachear sin riesgo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sin estos, el backend ve siempre la IP de nginx y el limitador de intentos agrupa a todos.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El tutor IA responde por streaming (SSE): no bufferizar.
        proxy_buffering off;
        proxy_read_timeout 130s;
    }

    # El ai-service NO se expone: solo el backend le habla, dentro de la red interna.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
